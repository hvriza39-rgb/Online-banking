<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6648;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3daa7a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4dca8a;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#1a6648;stop-opacity:0" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2419" flood-opacity="0.18"/>
    </filter>
    <clipPath id="hexClip">
      <polygon points="50,8 86,28 86,68 50,88 14,68 14,28"/>
    </clipPath>
  </defs>

  <!-- Hexagon mark -->
  <g filter="url(#softShadow)">
    <polygon points="50,8 86,28 86,68 50,88 14,68 14,28"
             fill="url(#iconGrad)" />
    <polygon points="50,8 86,28 86,68 50,88 14,68 14,28"
             fill="url(#shineGrad)" />
    <!-- Inner hex outline -->
    <polygon points="50,16 78,32 78,64 50,80 22,64 22,32"
             fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  </g>

  <!-- N letterform inside hex -->
  <g clip-path="url(#hexClip)">
    <!-- Stylised N: two verticals + diagonal -->
    <line x1="30" y1="32" x2="30" y2="64" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="70" y1="32" x2="70" y2="64" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="30" y1="32" x2="70" y2="64" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <!-- "Nexa" — serif, deep navy -->
  <text
    x="102" y="62"
    font-family="'Playfair Display', 'Georgia', serif"
    font-size="38"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#0f2419">Nexa</text>

  <!-- "Bank" — lighter weight, green -->
  <text
    x="102" y="81"
    font-family="'IBM Plex Sans', 'Helvetica Neue', sans-serif"
    font-size="13"
    font-weight="600"
    letter-spacing="5"
    fill="#1e7a52">BANK</text>

  <!-- Thin rule between name and tagline -->
  <line x1="102" y1="67.5" x2="285" y2="67.5" stroke="#c8dfd5" stroke-width="0.75"/>
</svg>
